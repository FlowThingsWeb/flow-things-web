# Ajusta los precios de la tienda según el costo de reposición del CRM.
#
# Diario. Era semanal, con este motivo: el costo de reposición sólo cambia
# cuando entra una compra nueva, y mover precios todos los días confunde a quien
# está mirando un producto.
#
# Dejó de alcanzar cuando el precio pasó a depender también del de Mercado
# Libre: si la publicación de ML está más barata, la web cede margen (26%/14%
# en vez de 28%/17%), y vuelve a los normales cuando ML sube. Los precios de ML
# se mueven todos los días con las promociones, así que con corrida semanal una
# publicación podía quedarse hasta seis días con el margen recortado después de
# que ML ya había subido.
#
# Lo que evita el manoseo diario no es la frecuencia sino la tolerancia del 3%:
# revisa 106 productos y no toca los que ya están cerca del objetivo.
#
# Va por GitHub Actions y no por Vercel porque el plan Hobby permite pocos
# crons; tampoco por n8n, cuyo plan gratuito ya consume el workflow de ML.
#
# Secretos que usa:
#   - CRON_SECRET (el mismo del resto de los crons de la web)

name: Ajustar precios de la tienda

on:
  schedule:
    # Todos los días 10:23 de Buenos Aires (13:23 UTC).
    #
    # Después del ciclo de promociones del CRM (11:09) y de los avisos de ML,
    # a propósito: el precio de la web se calcula comparando contra el precio
    # efectivo de ML, así que tiene que correr con los precios de ML del día ya
    # actualizados. Al revés compararía contra los de ayer.
    #
    # Minuto "raro" a propósito: GitHub documenta que los schedule se demoran
    # cuando hay mucha carga, y la carga se concentra en punto y a la media
    # porque es donde programa todo el mundo. Con :00/:30/:45 estos crons
    # llegaban entre 2 y 5 horas tarde TODOS los días.
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      simulacion:
        description: "Calcular y avisar sin cambiar precios"
        type: boolean
        default: true
      max:
        description: "Tope de precios a cambiar en esta corrida (vacío = 25)"
        type: string
        default: ""

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Recalcular precios
        run: |
          # Los parámetros se arman juntos: ?dry=1&max=90 o ?max=90 o nada.
          PARAMS=""
          if [ "${{ inputs.simulacion }}" = "true" ]; then PARAMS="dry=1"; fi
          if [ -n "${{ inputs.max }}" ]; then
            if [ -n "$PARAMS" ]; then PARAMS="$PARAMS&max=${{ inputs.max }}";
            else PARAMS="max=${{ inputs.max }}"; fi
          fi
          if [ -n "$PARAMS" ]; then DRY="?$PARAMS"; else DRY=""; fi
          # -L porque el dominio sin www redirige, y --fail sin seguir el
          # redirect daría error 22 sin haber llegado al endpoint.
          # --fail-with-body para que el motivo del error quede en el log: con
          # --fail a secas sólo se ve "error 500" y hay que adivinar.
          curl -sSL --fail-with-body \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.flowthings.com.ar/api/cron/ajustar-precios$DRY"
