name: Carritos abandonados

# Los recordatorios son a las 2 horas, al día y a la semana, así que el cron
# tiene que correr seguido: con el diario de Vercel (plan Hobby), el mail de
# "2 horas" podía salir hasta 24 horas tarde y llegaba como el del día.
#
# Cada media hora es suficiente para que cada etapa caiga cerca de su momento
# sin mandar nada de más: el endpoint marca la etapa apenas la envía, así que
# correr de más no duplica mails.
#
# El endpoint está protegido con CRON_SECRET (Settings → Secrets and variables
# → Actions), el mismo que usan los demás crons de la web.
#
# OJO con el dominio: flowthings.com.ar responde 308 hacia www. Sin -L, curl
# imprime "Redirecting..." y sale con código 0 — el workflow figura en verde y
# el endpoint nunca se ejecutó. Y con -L tampoco alcanzaría: curl descarta el
# header Authorization al seguir un redirect que cambia de host, así que
# llegaría un 401. La URL tiene que apuntar a www directamente.
on:
  schedule:
    # Minuto "raro" a propósito: GitHub documenta que los schedule se demoran
    # cuando hay mucha carga, y la carga se concentra en punto y a la media
    # porque es donde programa todo el mundo. Con :00/:30/:45 estos crons
    # llegaban entre 2 y 5 horas tarde TODOS los días.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar /api/cron/carritos-abandonados
        run: |
          curl -sS --fail-with-body -X GET \
            "https://www.flowthings.com.ar/api/cron/carritos-abandonados" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
